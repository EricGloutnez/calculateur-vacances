name: Release

# Fabrique le .exe et publie la Release « vX.Y.Z », soit en poussant l'étiquette,
# soit avec le bouton « Run workflow » (onglet Actions) en donnant le numéro de version.
# L'application vérifie cette Release au démarrage pour se mettre à jour.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex. 1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Inscrire la version
        shell: pwsh
        run: |
          $version = "${{ inputs.version || github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version invalide : $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Content -Path vacances/_version.py -Value "__version__ = `"$version`"" -Encoding utf8
      - name: Vérifier la création des raccourcis sous Windows
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from vacances import installation as i; i.creer_raccourcis(Path(r'C:\Windows\notepad.exe'))"
          foreach ($dossier in @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs'))) {
            $lnk = Join-Path $dossier 'Calculateur de vacances.lnk'
            if (-not (Test-Path $lnk)) { throw "Raccourci absent : $lnk" }
            $cible = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
            if ($cible -ne 'C:\Windows\notepad.exe') { throw "Mauvaise cible : $cible" }
            Remove-Item $lnk
          }
      - name: Fabriquer le .exe
        run: pyinstaller --noconfirm --onefile --windowed --name CalculateurVacances --icon icone.ico --add-data "icone.ico;." main.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/CalculateurVacances.exe
          # Republier une version existante remplace son .exe.
          overwrite_files: true
          generate_release_notes: true
